name: Portal Visual QA

on:
  push:
    branches:
      - feature/redizajn-portala-animacije-2026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-visual-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser testing tools separately
        run: npm install --prefix /tmp/portal-playwright --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
      - name: Verify installed Chrome
        run: google-chrome --version
      - name: Start isolated static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portal-preview.log 2>&1 &
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portal-preview.log
          exit 1
      - name: Render mobile tablet desktop and run interaction tests
        run: |
          mkdir -p screenshots
          node qa/portal-visual-check.mjs
        env:
          QA_URL: http://127.0.0.1:4173/
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-design-preview
          path: screenshots/
          retention-days: 14
          if-no-files-found: ignore
