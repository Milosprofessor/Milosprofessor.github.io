<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1425">
<meta name="description" content="Hram Pitagore — besplatna, samostalna matematička avantura za sedmi razred.">
<title>Hram Pitagore | Matematička avantura</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b1425;
  --panel:#121f35;
  --panel2:#182943;
  --ink:#ecf4ff;
  --muted:#afc0d8;
  --line:rgba(214,230,255,.14);
  --gold:#f7c873;
  --aqua:#6be4ce;
  --red:#f8a9a9;
  --ok:#a3efbf;
  --shade:0 16px 60px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 80% 1%,rgba(35,71,110,.86) 0,transparent 36%),
    radial-gradient(ellipse at 0 100%,rgba(25,46,72,.95) 0,transparent 40%),
    linear-gradient(180deg,#091121 0%,#0b1425 100%);
  position:relative;
  overflow-x:hidden;
}
body::before,
body::after{
  content:"";
  position:fixed;
  inset:auto;
  pointer-events:none;
  z-index:0;
  filter:blur(18px);
}
body::before{
  width:300px;
  height:300px;
  left:-80px;
  bottom:12vh;
  border-radius:50%;
  background:radial-gradient(circle,rgba(107,228,206,.12),transparent 70%);
  animation:glowShift 8s ease-in-out infinite;
}
body::after{
  width:240px;
  height:240px;
  right:-60px;
  top:14vh;
  border-radius:50%;
  background:radial-gradient(circle,rgba(247,200,115,.10),transparent 70%);
  animation:glowShift 10s ease-in-out infinite reverse;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}
button:disabled{opacity:.55;cursor:not-allowed}
.shell{width:min(1160px,calc(100% - 32px));margin:auto;position:relative;z-index:1}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 0;gap:16px}
.brand{display:flex;gap:12px;align-items:center;font-weight:800;letter-spacing:.02em}
.brand-symbol{
  display:grid;place-items:center;width:42px;height:42px;border-radius:13px;
  background:linear-gradient(145deg,#f8dc9b,#d69541);color:#18273b;font:700 29px Georgia,serif;
  box-shadow:0 8px 18px rgba(214,149,65,.25);
}
.top-tag{border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--muted);font-size:.82rem;white-space:nowrap;background:rgba(255,255,255,.03)}
.eyebrow{color:var(--aqua);text-transform:uppercase;letter-spacing:.16em;font-size:.77rem;font-weight:800}
.hero{display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:34px;min-height:calc(100vh - 144px);padding-bottom:55px}
.hero h1{font:700 clamp(3.1rem,7vw,5.5rem)/1.05 Georgia,serif;letter-spacing:-.05em;margin:10px 0 16px}
.hero h1 span{color:var(--gold)}
.intro{color:#c5d3e6;max-width:560px;font-size:1.12rem}
.feature-pills{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:99px;padding:7px 12px;color:#d9e5f3;font-size:.84rem}
.btn{appearance:none;border:0;border-radius:13px;padding:14px 21px;font-weight:800;min-height:49px;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s,filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}
.btn-primary{background:linear-gradient(110deg,#ffe0a0,#efbc60);color:#17253b;box-shadow:0 12px 28px rgba(233,166,66,.18)}
.btn-secondary{background:#243751;color:var(--ink);border:1px solid var(--line)}
.btn-quiet{background:transparent;border:1px solid var(--line);color:#e1ebfa}
.fine{font-size:.82rem;color:var(--muted);margin-top:16px}
.illustration{position:relative;min-height:430px;display:grid;place-items:center;filter:drop-shadow(0 25px 50px rgba(0,0,0,.25))}
.illustration svg{width:min(100%,490px);height:auto;overflow:visible}
.temple-wrap{animation:floatTemple 5.2s ease-in-out infinite}
.temple-shadow{animation:shadowPulse 5.2s ease-in-out infinite}
.portal-glow{animation:portalPulse 2.6s ease-in-out infinite}
.portal-door{animation:portalPulse 2.6s ease-in-out infinite}
.rune{animation:runePulse 2.4s ease-in-out infinite}
.star{animation:twinkle 3.4s ease-in-out infinite}
.star.s2{animation-delay:.7s}
.star.s3{animation-delay:1.5s}
.star.s4{animation-delay:2.1s}
.star.s5{animation-delay:2.7s}
.mist-1{animation:drift 16s linear infinite}
.mist-2{animation:drift 22s linear infinite reverse}
.panel{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(24,42,68,.96),rgba(13,27,46,.97));box-shadow:var(--shade);backdrop-filter:blur(10px)}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;padding:12px 0 50px}
.main-panel{padding:clamp(20px,4vw,36px);min-height:650px;position:relative;overflow:hidden}
.main-panel::before{
  content:"";
  position:absolute;
  width:360px;height:360px;right:-150px;top:-160px;border-radius:50%;
  background:radial-gradient(circle,rgba(107,228,206,.11),transparent 70%);
  pointer-events:none;
}
.sidebar{padding:24px;align-self:start;position:sticky;top:20px}
.back-link{background:none;border:0;color:var(--muted);padding:0;font-weight:700;margin-bottom:22px}
.back-link:hover{text-decoration:underline}
.room-kicker{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--aqua);font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.11em}
.room-heading{font:700 clamp(2rem,4.5vw,3.05rem)/1.12 Georgia,serif;margin:9px 0 10px}
.room-desc{color:#d4e1f0;max-width:680px;margin-bottom:18px}
.room-atmosphere{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.atmosphere-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(255,255,255,.03);color:#d8e5f3;font-size:.84rem}
.chip-dot{width:9px;height:9px;border-radius:50%;background:var(--aqua);box-shadow:0 0 12px rgba(107,228,206,.45);animation:chipPulse 2s ease-in-out infinite}
.chip-dot.gold{background:var(--gold);box-shadow:0 0 12px rgba(247,200,115,.42);animation-delay:.6s}
.visual-box{border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#2f5076 0%,#14263f 78%);padding:18px;margin:20px 0 24px;text-align:center;position:relative}
.visual-box::before{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 35%),radial-gradient(circle at 50% 18%,rgba(255,224,160,.12),transparent 36%);
}
.visual-box svg{position:relative;z-index:1;width:min(100%,520px);height:auto;max-height:280px;overflow:visible}
.diagram-note{color:#d6e3f2;font-size:.86rem;margin:12px 0 0;position:relative;z-index:1}
.question{font-weight:800;font-size:1.07rem;margin:15px 0}
.answer-form{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.answer-input{background:#0b182b;color:var(--ink);padding:13px 14px;border:1px solid #5b728f;border-radius:12px;width:min(240px,100%);min-height:50px;font-size:1.14rem}
.answer-input::placeholder{color:#93a6c0}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{min-height:75px;display:flex;align-items:center;gap:12px;text-align:left;border-radius:13px;border:1px solid #405472;background:#152a43;color:var(--ink);padding:14px 17px;font-weight:800}
.choice:hover,.choice:focus-visible{border-color:var(--gold);background:#213c59}
.choice span{font-size:1.4rem}
.muted{color:var(--muted)}
.support{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px}
.hint-panel,.message,.explain-panel{border-radius:16px;margin-top:16px;padding:16px 18px}
.hint-panel{border:1px solid rgba(107,228,206,.32);background:rgba(107,228,206,.08);color:#ddfff6}
.message{border:1px solid rgba(255,215,136,.35);background:rgba(255,215,136,.08)}
.message.error{border-color:rgba(248,169,169,.35);background:rgba(248,169,169,.07);color:#ffe1e1}
.message.success{border-color:rgba(163,239,191,.4);background:rgba(163,239,191,.1);color:#ddffe7}
.message strong{display:block;margin-bottom:4px}
.explain-panel{border:1px solid rgba(247,200,115,.30);background:linear-gradient(145deg,rgba(247,200,115,.08),rgba(255,255,255,.03))}
.explain-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,.75fr);gap:18px;align-items:start}
.explain-panel h3{margin:0 0 8px;font-size:1.08rem}
.explain-panel p{margin:0 0 12px;color:#dce8f6}
.step-list{display:grid;gap:10px}
.step-item{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:rgba(8,18,30,.26);border:1px solid rgba(255,255,255,.06)}
.step-no{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:rgba(247,200,115,.15);border:1px solid rgba(247,200,115,.25);color:#ffd993}
.step-text{font-weight:600;color:#f1f7ff}
.step-mini{font-size:.85rem;color:#c5d3e6;margin-top:2px}
.tablet{border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(180deg,rgba(36,54,77,.92),rgba(17,27,40,.96));padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tablet svg{width:100%;height:auto;display:block;overflow:visible}
.tablet-note{font-size:.82rem;color:#b7c7dd;margin-top:8px;text-align:center}
.bar{height:9px;background:#26374f;border-radius:99px;overflow:hidden;margin:12px 0 17px}
.bar > div{height:100%;background:linear-gradient(90deg,#59d4b8,#f6cd7f);transition:width .35s}
.map-list{display:grid;gap:14px;margin-top:22px}
.map-item{display:flex;align-items:center;gap:10px;color:#b4c5da}.map-item .number{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid #45607a;background:#1e324e;font-weight:800;flex:none}.map-item.done{color:#b5f1cc}.map-item.done .number{background:rgba(61,169,104,.15);border-color:#4ea67e}.map-item.active{color:#fff;font-weight:800}.map-item.active .number{background:#f4c779;color:#16253a;border-color:#f4c779}
.sidebar h3{font-size:1.05rem;margin:0 0 7px}.mini-note{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;font-size:.9rem;color:var(--muted)}
.result{max-width:780px;margin:28px auto 70px;text-align:center;padding:36px 28px;position:relative;overflow:hidden}
.result::before{content:"";position:absolute;inset:auto;top:-120px;left:50%;transform:translateX(-50%);width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(247,200,115,.16),transparent 70%)}
.result h1{font:700 clamp(2.5rem,6vw,4rem)/1.1 Georgia,serif;margin:12px 0}.result .medal{font-size:4.5rem}.result p{max-width:560px;margin:0 auto 20px;color:#d5e1ee}.result .summary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:430px;margin:26px auto}.summary-item{border:1px solid var(--line);border-radius:14px;padding:17px}.summary-item b{display:block;font-size:1.55rem;color:var(--gold)}
.footer{border-top:1px solid var(--line);color:#95a9c2;font-size:.8rem;padding:15px 0 28px;position:relative;z-index:1}.footer span+span{margin-left:14px}
.two-input{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.field{display:grid;gap:5px;color:#d3e1f0;font-weight:700}.field .answer-input{width:160px}.help-reason{color:var(--muted);font-size:.86rem;margin-top:8px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.math-text{paint-order:stroke;stroke:rgba(10,16,26,.35);stroke-width:6px;stroke-linejoin:round}
/* Game feel: vrata, ključevi, pobedničke nagrade */
.header-tools{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.audio-controls{display:flex;gap:6px;flex-wrap:wrap}
.audio-btn{border:1px solid rgba(202,224,245,.23);background:rgba(22,42,65,.86);color:#e0edf8;border-radius:11px;padding:8px 11px;font-size:.8rem;font-weight:800;min-height:38px}
.audio-btn[aria-pressed="true"]{border-color:rgba(107,228,206,.58);color:#c1fff1;background:rgba(66,151,138,.17)}
.audio-btn:active{transform:scale(.98)}
.hero-progress{margin-bottom:24px}
.key-inventory{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 13px;margin:15px 0;background:rgba(4,18,32,.36);border:1px solid rgba(247,200,115,.23);border-radius:14px;max-width:fit-content}
.inventory-label{font-weight:800;color:#f4dca8;font-size:.87rem;margin-right:3px}
.key-slot{width:31px;height:31px;display:grid;place-items:center;font-size:1.15rem;border-radius:9px;border:1px solid rgba(195,215,237,.18);background:rgba(255,255,255,.04);color:#718aa7}
.key-slot.earned{border-color:rgba(247,200,115,.68);background:rgba(247,200,115,.12);color:#ffe4a6;box-shadow:0 0 12px rgba(247,200,115,.10)}
.key-inventory b{font-size:.88rem;color:#f7d493;margin-left:4px;white-space:nowrap}
.room-scene{border-radius:18px;overflow:hidden;margin:16px 0 20px;border:1px solid rgba(173,214,243,.24);background:#13273f;position:relative;box-shadow:inset 0 0 22px rgba(0,0,0,.25)}
.room-scene svg{width:100%;height:auto;display:block;max-height:260px}
.scene-caption{position:absolute;left:11px;right:11px;bottom:9px;text-align:center;font-size:.78rem;line-height:1.35;font-weight:800;padding:6px 10px;border:1px solid rgba(255,255,255,.16);background:rgba(7,18,31,.87);border-radius:10px;color:#dbeaf9;max-width:fit-content;margin:0 auto;backdrop-filter:blur(4px)}
.room-scene.scene-unlocked{border-color:rgba(107,228,206,.6);box-shadow:0 0 26px rgba(107,228,206,.12)}
.gate-left,.gate-right{transition:transform 1.05s cubic-bezier(.23,.69,.2,1)}
.door-panels-open .gate-left,.scene-unlocked .gate-left{transform:translateX(-55px)}
.door-panels-open .gate-right,.scene-unlocked .gate-right{transform:translateX(55px)}
.door-lock{transition:opacity .42s,transform .6s;transform-origin:260px 156px}
.door-lock-open,.scene-unlocked .door-lock{opacity:0;transform:scale(.4) rotate(20deg)}
.torch{transform-origin:center 140px;animation:torchFlicker 1.2s ease-in-out infinite alternate}
.torch-right{animation-delay:.4s}
.scene-smoke{animation:sceneMist 9s ease-in-out infinite}
.scene-stars{animation:twinkle 2.2s ease-in-out infinite}
.room-emblem{animation:runePulse 2.8s ease-in-out infinite}
.door-done{padding:12px;border:1px solid rgba(107,228,206,.38);border-radius:12px;color:#b7ffeb;background:rgba(107,228,206,.08);font-weight:700}
.key-reward{display:flex;align-items:center;gap:14px;margin:16px 0 4px;padding:14px;background:rgba(247,200,115,.11);border-radius:16px;border:1px solid rgba(247,200,115,.32)}
.key-reward b,.key-reward span{display:block}.key-reward span{font-size:.87rem;color:#f5e7ca;margin-top:4px}
.reward-key{width:64px;height:64px;flex:none;filter:drop-shadow(0 4px 12px rgba(247,200,115,.45));animation:keyFloat 2.1s ease-in-out infinite}
.reward-key svg{width:100%;height:100%}
.unlock-controls{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.door-message{font-weight:700;color:#b9f4dc;margin:15px 0 10px}
.trophy-wrap{margin:0 auto 6px;width:155px;height:155px;position:relative;filter:drop-shadow(0 5px 28px rgba(255,210,111,.32));animation:trophyHover 3.7s ease-in-out infinite}
.trophy-graphic{display:block;width:100%;height:100%}
.awards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:24px auto 10px}
.award{flex:1 1 165px;max-width:220px;min-width:150px;border:1px solid rgba(247,200,115,.33);background:rgba(247,200,115,.08);padding:13px 12px;border-radius:16px;text-align:center;font-size:1.35rem}
.award b{display:block;font-size:.89rem;color:#ffdda0}.award small{display:block;font-size:.76rem;color:#c2d1e1;margin-top:6px}
.win-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.win-panel .key-inventory{margin:18px auto 0}
.confetti{position:absolute;top:-22px;left:var(--x);width:8px;height:16px;background:#f9d18c;border-radius:2px;opacity:0;pointer-events:none;animation:confettiFall var(--dur) linear var(--delay) infinite;transform:rotate(var(--rotation))}
.confetti:nth-child(3n){background:#7fe2c9}.confetti:nth-child(4n){background:#f4aeb8}
@keyframes torchFlicker{0%{opacity:.84;transform:scale(.97)}100%{opacity:1;transform:scale(1.035)}}
@keyframes sceneMist{0%,100%{transform:translateX(-12px)}50%{transform:translateX(18px)}}
@keyframes keyFloat{0%,100%{transform:translateY(0) rotate(-9deg)}50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes trophyHover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes confettiFall{0%{transform:translateY(-15px) rotate(var(--rotation));opacity:0}12%{opacity:.85}90%{opacity:.85}100%{transform:translateY(470px) rotate(440deg);opacity:0}}
@media(max-width:760px){.topbar{align-items:flex-start;flex-wrap:wrap}.header-tools{width:100%;justify-content:space-between;gap:8px}.top-tag{order:-1}.audio-btn{min-height:42px}.room-scene svg{min-height:160px}.scene-caption{font-size:.72rem;bottom:7px}.key-inventory{gap:5px;padding:8px 9px}.inventory-label{width:100%}.key-slot{width:28px;height:28px}.reward-key{width:52px;height:52px}.unlock-controls .btn{width:100%}.win-panel .awards{display:grid;grid-template-columns:1fr 1fr}.win-panel .award{min-width:0;width:100%}.trophy-wrap{width:132px;height:132px}}
@media(max-width:920px){.hero{grid-template-columns:1fr;min-height:auto;gap:8px;padding:32px 0 50px}.illustration{order:-1;min-height:250px}.illustration svg{max-height:300px}.game-layout{grid-template-columns:1fr}.sidebar{position:static;order:-1;padding:18px}.sidebar .map-list{grid-template-columns:repeat(5,1fr);gap:6px;margin-top:13px}.map-item{display:block;text-align:center;font-size:.69rem}.map-item .number{margin:auto auto 6px}.sidebar .mini-note{display:none}.main-panel{min-height:unset}.room-heading{font-size:2.25rem}.top-tag{font-size:.72rem}.choice-grid{grid-template-columns:1fr}.explain-grid{grid-template-columns:1fr}.tablet{max-width:460px;margin:0 auto}}
@media(max-width:760px){.visual-box{padding:10px}.answer-form .answer-input{flex:1;min-width:130px}.two-input .field{width:100%}.two-input .field .answer-input{width:100%}.two-input .btn{width:100%}}
@media(max-width:420px){.brand small{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@keyframes portalPulse{0%,100%{opacity:.75;filter:drop-shadow(0 0 0 rgba(107,228,206,.05))}50%{opacity:1;filter:drop-shadow(0 0 14px rgba(107,228,206,.35))}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:1;transform:scale(1.14)}}
@keyframes drift{0%{transform:translateX(-12px)}50%{transform:translateX(16px)}100%{transform:translateX(-12px)}}
@keyframes floatTemple{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shadowPulse{0%,100%{opacity:.34;transform:scaleX(1)}50%{opacity:.48;transform:scaleX(1.06)}}
@keyframes runePulse{0%,100%{opacity:.78}50%{opacity:1;filter:drop-shadow(0 0 8px rgba(255,219,150,.5))}}
@keyframes chipPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes glowShift{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

/* Različite filmske scene umesto jedne iste kapije u svakoj prostoriji */
.room-scene{border-color:rgba(157,197,220,.36);box-shadow:inset 0 0 42px rgba(0,0,0,.27),0 12px 26px rgba(0,0,0,.17);margin-top:12px}
.room-scene svg{max-height:none;min-height:200px}
.room-scene .scene-caption{max-width:calc(100% - 24px);bottom:12px;font-size:.82rem;background:rgba(4,15,29,.85);padding:7px 13px}
.room-scene.scene-solved{border-color:rgba(247,200,115,.78)}
.scene-frame-title{position:absolute;top:12px;left:12px;z-index:2;padding:7px 11px;border:1px solid rgba(245,210,145,.3);border-radius:10px;background:rgba(5,18,33,.77);color:#ffe2a9;font-size:.76rem;letter-spacing:.08em;font-weight:850;text-transform:uppercase;pointer-events:none}
.scene-svg .scene-stars{transform-origin:310px 120px;animation:twinkle 3.8s ease-in-out infinite}
.scene-svg .water-foam{animation:streaming 8s linear infinite}

function isCorrect(room,values){
  if(room.type==='choice'||room.type==='square')return values[0]===room.correct;
  if(room.type==='double')return isNumEqual(values[0],room.expected[0])&&isNumEqual(values[1],room.expected[1]);
  return isNumEqual(values[0],room.expected[0]);
}
function check(values){
  if(feedback?.ok||state.stage==='open')return;
  const room=rooms[state.index];
  const ok=isCorrect(room,values);
  feedback={ok,body:ok?room.success:'To još nije tačno. Pogledaj skicu, utvrdi katete i hipotenuzu, pa pokušaj ponovo. Ako zapneš, otvori pomoć i isprati korake.'};
  sfx(ok?'correct':'error');if(ok){document.getElementById('roomScene')?.classList.add('scene-solved');const cap=document.getElementById('sceneCaption');if(cap)cap.textContent='✨ Mehanizam je pokrenut — uzmi zlatni ključ!';}showFeedback(feedback);
}
function collectKey(){
  if(!feedback?.ok||state.stage==='open')return;
  state.stage='open';save();sfx('key');
  document.getElementById('roomScene')?.classList.add('scene-solved','scene-unlocked');
  const caption=document.getElementById('sceneCaption');
  if(caption)caption.textContent='🔓 Put je otvoren — pređi u sledeću prostoriju!';
  document.querySelectorAll('.key-inventory').forEach(node=>{
    node.outerHTML=inventoryHtml();
  });
  const btn=document.getElementById('collect');if(btn)btn.remove();
  const nextArea=document.getElementById('nextSlot');
  if(nextArea)nextArea.innerHTML=`<div class="door-message">✦ Ključ je osvojen. Drevna vrata se otvaraju!</div><button id="next" class="btn btn-primary">${state.index===4?'Osvoji nagradu':'Uđi u sledeću prostoriju'} →</button>`;
  const next=document.getElementById('next');if(next)next.onclick=advance;
  sfx('door');
}
function advance(){
  if(state.stage!=='open')return;
  state.index++;state.solved=state.index;state.stage='locked';save();
  showHint=false;feedback=null;
  view=state.index===5?'win':'game';render();
  if(view==='win')sfx('victory');else sfx('start');
  window.scrollTo?.({top:0,behavior:'instant'});
}
function showFeedback(f){
  const node=document.getElementById('feedback');if(!node)return;
  const alreadyOpen=state.stage==='open';
  node.innerHTML=`<div class="message ${f.ok?'success':'error'}"><strong>${f.ok?'✓ Zagonetka rešena!':'Pokušaj još jednom'}</strong>${esc(f.body)}${f.ok?`${alreadyOpen?'<div class="door-message">✦ Ključ je u zbirci. Vrata su otvorena.</div>':`<div class="key-reward"><div class="reward-key">${keySVG()}</div><div><b>Pronađen je zlatni ključ!</b><span>Uzmi ga da otključaš kapiju.</span></div></div>`}<div id="nextSlot" class="unlock-controls">${alreadyOpen?`<button id="next" class="btn btn-primary">${state.index===4?'Osvoji nagradu':'Uđi u sledeću prostoriju'} →</button>`:'<button id="collect" class="btn btn-primary">🗝 Uzmi ključ i otključaj vrata</button>'}</div>`:''}</div>`;
  if(f.ok){
    document.querySelectorAll('#answerArea input,#answerArea button').forEach(el=>el.disabled=true);
    const collect=document.getElementById('collect');if(collect)collect.onclick=collectKey;
    const next=document.getElementById('next');if(next)next.onclick=advance;
  }
}
function renderWin(){
  const trophyKey=`<svg class="trophy-graphic" viewBox="0 0 160 160" aria-label="Zlatni pehar čuvara Hrama"><defs><linearGradient id="cupGold" x1="0" x2="1"><stop stop-color="#ffeaa9"/><stop offset=".5" stop-color="#edae47"/><stop offset="1" stop-color="#fff0c5"/></linearGradient></defs><path d="M41 33h78v44a39 39 0 0 1-78 0z" fill="url(#cupGold)" stroke="#ffe9b1" stroke-width="3"/><path d="M42 40H22v20a24 24 0 0 0 24 24M118 40h20v20a24 24 0 0 1-24 24" fill="none" stroke="#e6a84c" stroke-width="9"/><path d="M80 112v20M52 143h56" fill="none" stroke="#ffe39e" stroke-width="13" stroke-linecap="round"/><text x="80" y="90" text-anchor="middle" font-family="Georgia" font-size="40" fill="#533b1a">△</text></svg>`;
  const confetti=Array.from({length:22},(_,i)=>`<i class="confetti" aria-hidden="true" style="--x:${(i*37)%100}%;--delay:${(i%7)*.26}s;--dur:${3+i%4}s;--rotation:${i*55}deg"></i>`).join('');
  app.innerHTML=`<section class="panel result win-panel">${confetti}<div class="trophy-wrap">${trophyKey}</div><div class="eyebrow">AVANTURA JE ZAVRŠENA</div><h1>Postao/la si čuvar Hrama Pitagore!</h1><p>Uz pomoć matematike sagradio/la si most, aktivirao/la stub, probudio/la piramidu, pokrenuo/la kvadratni pod i podigao/la pravougaonu kapiju.</p>${inventoryHtml()}<div class="awards"><div class="award">🏆 <b>Čuvar teoreme</b><small>Završi svih pet prostorija</small></div><div class="award">🗝 <b>Pet drevnih ključeva</b><small>Otključaj svaku kapiju</small></div>${state.hints===0?'<div class="award">⭐ <b>Samostalni istraživač</b><small>Avantura bez pomoći</small></div>':''}</div><div class="summary"><div class="summary-item"><b>5 / 5</b><span class="muted">otključanih kapija</span></div><div class="summary-item"><b>${state.hints}</b><span class="muted">korišćenih pomoći</span></div></div><div class="win-buttons"><button id="restart" class="btn btn-primary">Igraj ponovo</button><button id="home" class="btn btn-secondary">Početna</button></div><p class="help-reason">Pilot verzija 1.3 · Napredak je sačuvan samo na ovom uređaju.</p></section>`;
  document.getElementById('restart').onclick=reset;
  document.getElementById('home').onclick=goHome;
}
function render(){if(view==='home')renderHome();else if(view==='game')renderGame();else renderWin()}
render();
})();
</script>
</body>
</html>
